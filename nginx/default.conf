server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # SvelteKit/Vite hashed assets are content-addressed and safe to cache long-term.
    location ^~ /_app/immutable/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Keep the app shell and service worker revalidatable so updates can be discovered.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        # nginx's stock mime.types has no mapping for .webmanifest, so it would
        # otherwise be served as application/octet-stream and browsers would
        # reject it for PWA installability (PRD FR-13).
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Missing ordinary assets should be 404s, not the SPA shell.
    location ~* \.(?:avif|css|gif|ico|jpe?g|js|json|map|png|svg|txt|webmanifest|webp|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes, including /tools/<id>, use the generated SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # [NEW] Serve Docker/offline-localised assets from /assets/.
    # Only relevant for the Docker/offline target; the online target serves
    # assets from Pages/R2 instead.
    location ^~ /assets/ {
        alias /usr/share/nginx/assets/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
